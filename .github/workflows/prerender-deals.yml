name: Pre-render deals page

on:
  workflow_dispatch: {}
  # Fired by au-plans-scraper right after it publishes fresh pricing data.
  repository_dispatch:
    types: [deals-data-updated]

permissions:
  contents: write

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: Pre-render deals page
        run: python scripts/prerender.py

      - name: Build provider pages
        run: python scripts/build_provider_pages.py

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "jrsdigital-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add deals/ sitemap.xml
          if git diff --cached --quiet; then
            echo "No pre-render changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: pre-render deals page [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Give GitHub Pages time to deploy, then tell Bing/IndexNow which pages changed.
      - name: Ping IndexNow
        if: steps.commit.outputs.changed == 'true'
        run: |
          sleep 120
          python scripts/indexnow_ping.py
