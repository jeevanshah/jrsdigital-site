name: Pre-render deals page

on:
  workflow_dispatch: {}
  # Fired by au-plans-scraper right after it publishes fresh pricing data.
  repository_dispatch:
    types: [deals-data-updated]

permissions:
  contents: write

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: Pre-render deals page
        run: python scripts/prerender.py

      - name: Commit if changed
        run: |
          git config user.name "jrsdigital-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add deals/index.html
          if git diff --cached --quiet; then
            echo "No pre-render changes to commit"
          else
            git commit -m "chore: pre-render deals page [skip ci]"
            git push
          fi
